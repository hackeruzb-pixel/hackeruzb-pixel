<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Slide Ultimate</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}

body{
 background:#0f172a;
 color:white;
 display:flex;
 height:100vh;
}

/* PANEL */
.panel{
 width:30%;
 background:#111827;
 padding:10px;
 overflow:auto;
}

input,textarea{
 width:100%;
 padding:8px;
 margin-bottom:8px;
 border:none;
 border-radius:8px;
 background:#1f2937;
 color:white;
}

button{
 width:100%;
 padding:8px;
 margin-bottom:8px;
 border:none;
 border-radius:8px;
 cursor:pointer;
}

.add{background:#22c55e;}
.save{background:#3b82f6;}
.play{background:#f59e0b;}

/* PREVIEW */
.preview{
 width:70%;
 display:flex;
 justify-content:center;
 align-items:center;
 position:relative;
}

.slide{
 width:80%;
 height:80%;
 background:white;
 color:black;
 border-radius:20px;
 position:absolute;
 overflow:hidden;
}

.element{
 position:absolute;
 cursor:move;
 padding:5px;
}

.resize{
 width:10px;
 height:10px;
 background:red;
 position:absolute;
 right:0;
 bottom:0;
 cursor:se-resize;
}

/* CONTROLS */
.controls{
 position:absolute;
 bottom:20px;
}

.btn{
 padding:10px;
 margin:5px;
 border:none;
 border-radius:10px;
 background:#6366f1;
 color:white;
}
</style>
</head>

<body>

<div class="panel">
<h3>🎨 Editor</h3>

<input id="textInput" placeholder="Matn">
<button class="add" onclick="addText()">➕ Text</button>

<input type="file" id="imgInput">
<button class="add" onclick="addImage()">🖼 Image</button>

<input id="videoInput" placeholder="YouTube link">
<button class="add" onclick="addVideo()">🎬 Video</button>

<button class="save" onclick="save()">💾 Save</button>
<button class="play" onclick="playSlides()">▶ Slideshow</button>
</div>

<div class="preview" id="preview">
  <div class="slide" id="slide"></div>

  <div class="controls">
    <button class="btn" onclick="prev()">⬅️</button>
    <button class="btn" onclick="next()">➡️</button>
  </div>
</div>

<script>
let slides = JSON.parse(localStorage.getItem("slides")) || [[]];
let current = 0;
let slide = document.getElementById("slide");

// VIDEO ID
function getVideoId(url){
 if(!url) return "";
 let id = url.includes("v=")?url.split("v=")[1]:url.split("/").pop();
 return id.split("?")[0];
}

// CREATE ELEMENT
function createElement(html){
 let el = document.createElement("div");
 el.className="element";
 el.innerHTML = html + `<div class="resize"></div>`;

 el.style.top="50px";
 el.style.left="50px";

 // DRAG
 el.onmousedown=function(e){
   let shiftX=e.clientX-el.offsetLeft;
   let shiftY=e.clientY-el.offsetTop;

   function move(e){
     el.style.left=e.clientX-shiftX+"px";
     el.style.top=e.clientY-shiftY+"px";
   }

   document.addEventListener("mousemove",move);
   document.onmouseup=()=>document.removeEventListener("mousemove",move);
 };

 // RESIZE
 let res = el.querySelector(".resize");
 res.onmousedown=function(e){
   e.stopPropagation();
   document.onmousemove=function(ev){
     el.style.width=ev.clientX-el.offsetLeft+"px";
     el.style.height=ev.clientY-el.offsetTop+"px";
   };
   document.onmouseup=()=>document.onmousemove=null;
 };

 slide.appendChild(el);
 slides[current].push(el.outerHTML);
}

// ADD TEXT
function addText(){
 createElement(`<div>${textInput.value}</div>`);
}

// ADD IMAGE
function addImage(){
 let file = imgInput.files[0];
 let reader = new FileReader();
 reader.onload=e=>{
  createElement(`<img src="${e.target.result}" style="width:100%">`);
 };
 reader.readAsDataURL(file);
}

// ADD VIDEO
function addVideo(){
 let id = getVideoId(videoInput.value);
 createElement(`<iframe src="https://www.youtube.com/embed/${id}" width="200" height="150"></iframe>`);
}

// RENDER
function render(){
 slide.innerHTML="";
 slides[current].forEach(h=>{
   let div=document.createElement("div");
   div.innerHTML=h;
   slide.appendChild(div.firstChild);
 });
}

// NAV
function next(){
 if(current<slides.length-1){current++;render();}
}
function prev(){
 if(current>0){current--;render();}
}

// SAVE
function save(){
 localStorage.setItem("slides",JSON.stringify(slides));
 alert("Saved 💾");
}

// AUTO SLIDESHOW
function playSlides(){
 let i=0;
 let interval=setInterval(()=>{
   current=i;
   render();
   i++;
   if(i>=slides.length) clearInterval(interval);
 },2000);
}

// INIT
render();
</script>

</body>
</html>
