<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Slayd Generator</title>

<style>
body{
  margin:0;
  font-family:Arial;
  display:flex;
  height:100vh;
}

/* LEFT PANEL */
.panel{
  width:35%;
  background:#111827;
  color:white;
  padding:15px;
  box-sizing:border-box;
}

input, textarea{
  width:100%;
  margin-bottom:10px;
  padding:10px;
  border-radius:10px;
  border:none;
}

textarea{height:80px;}

button{
  width:100%;
  padding:10px;
  margin-bottom:10px;
  border:none;
  border-radius:10px;
  cursor:pointer;
}

.add{background:#22c55e;color:white;}
.export{background:#3b82f6;color:white;}

/* RIGHT PREVIEW */
.preview{
  width:65%;
  background:#0f172a;
  display:flex;
  justify-content:center;
  align-items:center;
}

.slide{
  width:80%;
  height:80%;
  background:white;
  border-radius:20px;
  padding:20px;
  display:flex;
  justify-content:space-between;
}

.left{
  width:55%;
}

.title{
  font-size:24px;
  font-weight:bold;
}

.subtitle{
  color:gray;
  margin-bottom:10px;
}

.card{
  width:40%;
  text-align:center;
}

img{
  width:100%;
  border-radius:15px;
}

iframe{
  width:100%;
  height:150px;
  margin-top:10px;
  border-radius:10px;
}
</style>
</head>

<body>

<!-- LEFT -->
<div class="panel">
<h2>🎨 Slayd yaratish</h2>

<input id="title" placeholder="Title">
<input id="subtitle" placeholder="Subtitle">
<textarea id="text" placeholder="Matn"></textarea>
<input id="image" placeholder="Rasm link">
<input id="video" placeholder="YouTube link">

<button class="add" onclick="generate()">➕ Slayd qo‘shish</button>
<button class="export" onclick="exportHTML()">📤 HTML yuklab olish</button>
</div>

<!-- RIGHT -->
<div class="preview">
  <div id="result"></div>
</div>

<script>
let slides = [];

function getVideoId(url){
  if(!url) return "";
  let id = url.split("v=")[1] || url.split("/").pop();
  return id.split("?")[0];
}

function generate(){
  let t = document.getElementById("title").value;
  let sub = document.getElementById("subtitle").value;
  let txt = document.getElementById("text").value;
  let img = document.getElementById("image").value;
  let vid = getVideoId(document.getElementById("video").value);

  let html = `
  <section class="slide">
    <div class="left">
      <div class="title">${t}</div>
      <div class="subtitle">${sub}</div>
      <div>${txt}</div>
    </div>
    <div class="card">
      <img src="${img}">
      ${vid ? `<iframe src="https://www.youtube.com/embed/${vid}"></iframe>` : ""}
    </div>
  </section>
  `;

  slides.push(html);
  document.getElementById("result").innerHTML = html;
}

function exportHTML(){
  let full = `
  <!doctype html>
  <html>
  <head><meta charset="utf-8"><title>Slaydlar</title></head>
  <body>
  ${slides.join("")}
  </body>
  </html>
  `;

  let blob = new Blob([full], {type:"text/html"});
  let a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "slides.html";
  a.click();
}
</script>

</body>
</html>
